spring.application.name=campus-book-exchange
server.port=${PORT:8080}

# Database: defaults to in-memory H2 so the app runs anywhere with no setup.
# For MySQL set:  DB_URL=jdbc:mysql://host:3306/campus_book_exchange?createDatabaseIfNotExist=true
#                 DB_USER=...  DB_PASSWORD=...
spring.datasource.url=${DB_URL:jdbc:h2:mem:campus;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Load demo data from data.sql on every start (it is safe to re-run)
spring.sql.init.mode=always

spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
