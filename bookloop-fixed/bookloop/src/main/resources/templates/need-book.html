<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Request a book | BookLoop</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="form-page">
  <a class="back-link" th:href="@{/}">← Back to books</a>
  <div class="form-heading"><p class="eyebrow">THE COMMUNITY CAN HELP</p><h1>Need a book?</h1><p class="muted">Tell us which book you are searching for.</p></div>
  <div th:if="${successMessage}" class="alert success" th:text="${successMessage}"></div>
  <form class="form-card" th:action="@{/need-book}" th:object="${bookRequest}" method="post">
    <div class="form-grid">
      <label class="full">Book title *<input type="text" th:field="*{title}" placeholder="Enter the title you need" required><small class="field-error" th:errors="*{title}"></small></label>
      <label>Course *<input type="text" th:field="*{course}" placeholder="e.g. CSE" required><small class="field-error" th:errors="*{course}"></small></label>
      <label>Semester *<select th:field="*{semester}" required><option value="">Choose semester</option><option th:each="s : ${#numbers.sequence(1,8)}" th:value="${s}" th:text="${s}"></option></select><small class="field-error" th:errors="*{semester}"></small></label>
      <label class="full">College *<input type="text" th:field="*{college}" placeholder="Your college name" required><small class="field-error" th:errors="*{college}"></small></label>
      <label class="full">Your contact *<input type="text" th:field="*{contact}" placeholder="College email or contact number" required><small class="field-error" th:errors="*{contact}"></small></label>
    </div>
    <button class="button button-primary button-wide" type="submit">Submit book request →</button>
  </form>
</main>
<footer><a class="brand" th:href="@{/}"><span class="brand-icon">B</span> BookLoop</a><span>Share knowledge. Reuse books. Help your campus.</span></footer>
</body>
</html>
